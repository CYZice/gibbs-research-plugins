[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gibbs-research-tools"
version = "0.1.0"
description = "Agent-oriented literature, reproducible figures and cited research reports"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "matplotlib>=3.9,<4", "jinja2>=3.1,<4", "playwright>=1.48,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
weasyprint = ["weasyprint>=63"]

[project.scripts]
gibbs-research = "gibbs_research.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
gibbs_research = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
