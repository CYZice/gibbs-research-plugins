[project]
name = "literature-kb-backend"
version = "0.1.0"
description = "Backend skeleton for a multimodal literature evidence base."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "cryptography>=44.0",
  "cos-python-sdk-v5>=1.9.37",
  "fastapi>=0.115",
  "openalex-official==0.3.3",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "requests>=2.32",
  "redis>=5.2",
  "rq>=2.8,<3",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
literature-kb-import = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires real isolated Redis/PostgreSQL infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
