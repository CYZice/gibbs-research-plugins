services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: literature_kb_test
      POSTGRES_USER: literature_test
      POSTGRES_PASSWORD: literature_test
    ports:
      - "15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature_test -d literature_kb_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "16380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
